plugins {
    id "com.android.application"
}

android {
    namespace "com.mrraita.textselectioncustomizer"
    compileSdk 36

    defaultConfig {
        applicationId "com.mrraita.textselectioncustomizer"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

dependencies {
    compileOnly "de.robv.android.xposed:api:82"
}
