name: APK derle (yeniden kullanılabilir)

# Ön derleme ve kararlı sürüm akışları bunu çağırır; ikisi de aynı adımlarla ve aynı anahtarla imzalar.
on:
  workflow_call:
    inputs:
      require_signing:
        description: İmza anahtarı yoksa derlemeyi başarısız say
        type: boolean
        default: false
      verbose_log:
        description: Ayrıntılı olay kaydı özelliğini derlemeye kat (yalnızca ön derleme)
        type: boolean
        default: false
    outputs:
      version:
        description: app/build.gradle.kts içindeki versionName
        value: ${{ jobs.build.outputs.version }}
      signed:
        description: Yayın anahtarıyla imzalandı mı
        value: ${{ jobs.build.outputs.signed }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      signed: ${{ steps.keys.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle sürümünü oku
        id: gv
        run: |
          V=$(sed -n 's#.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*#\1#p' gradle/wrapper/gradle-wrapper.properties | head -1)
          test -n "$V" || { echo "::error::gradle-wrapper.properties içinde Gradle sürümü bulunamadı"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: ${{ steps.gv.outputs.version }}

      # Depoda gradle-wrapper.jar yoksa (ikili dosya) resmi sarmalayıcıyı üret
      - name: Gradle sarmalayıcıyı hazırla
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "${{ steps.gv.outputs.version }}"
          fi
          chmod +x gradlew

      - name: İmza anahtarını hazırla
        id: keys
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          REQUIRE_SIGNING: ${{ inputs.require_signing }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [ "$REQUIRE_SIGNING" = "true" ]; then
              echo "::error::SIGNING_KEYSTORE_BASE64 tanımlı değil; kararlı sürüm yayın anahtarı olmadan derlenmez."
              exit 1
            fi
            echo "::warning::SIGNING_KEYSTORE_BASE64 tanımlı değil; APK debug anahtarıyla imzalanacak (her derlemede farklı imza)."
          fi

      - name: Sürüm bilgisini oku
        id: meta
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: APK derle
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SOUNDMOD_VERBOSE: ${{ inputs.verbose_log }}
        run: ./gradlew assembleRelease --stacktrace

      - name: APK'yı adlandır ve imzayı göster
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "SoundMod-${VERSION}.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "SoundMod-${VERSION}.apk" | grep -i "SHA-256" || true

      - name: APK'yı yükle
        uses: actions/upload-artifact@v7
        with:
          name: SoundMod-apk
          path: SoundMod-*.apk
          if-no-files-found: error
