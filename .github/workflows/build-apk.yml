name: Build APK (reusable)

# The pre-build and stable release workflows call this; both build and sign with the same steps and the same key.
on:
  workflow_call:
    inputs:
      require_signing:
        description: Fail the build if there is no signing key
        type: boolean
        default: false
      verbose_log:
        description: Include the verbose event log feature in the build (pre-build only)
        type: boolean
        default: false
    secrets:
      SIGNING_KEYSTORE_BASE64:
        required: false
      SIGNING_KEYSTORE_PASSWORD:
        required: false
      SIGNING_KEY_ALIAS:
        required: false
      SIGNING_KEY_PASSWORD:
        required: false
    outputs:
      version:
        description: versionName from app/build.gradle.kts
        value: ${{ jobs.build.outputs.version }}
      signed:
        description: Whether it was signed with the release key
        value: ${{ jobs.build.outputs.signed }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      signed: ${{ steps.keys.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Read the Gradle version
        id: gv
        run: |
          V=$(sed -n 's#.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*#\1#p' gradle/wrapper/gradle-wrapper.properties | head -1)
          test -n "$V" || { echo "::error::Could not find the Gradle version in gradle-wrapper.properties"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          S=$(sed -n 's/^distributionSha256Sum=//p' gradle/wrapper/gradle-wrapper.properties | head -1)
          echo "sha=$S" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: ${{ steps.gv.outputs.version }}

      # If the repository has no gradle-wrapper.jar (binary file), generate the official wrapper
      - name: Prepare the Gradle wrapper
        env:
          GV: ${{ steps.gv.outputs.version }}
          GSHA: ${{ steps.gv.outputs.sha }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            # Verify the distribution against the checksum pinned in gradle-wrapper.properties
            if [ -n "$GSHA" ]; then
              gradle wrapper --gradle-version "$GV" --gradle-distribution-sha256-sum "$GSHA"
            else
              gradle wrapper --gradle-version "$GV"
            fi
          fi
          chmod +x gradlew

      - name: Prepare the signing key
        id: keys
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          REQUIRE_SIGNING: ${{ inputs.require_signing }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [ "$REQUIRE_SIGNING" = "true" ]; then
              echo "::error::SIGNING_KEYSTORE_BASE64 is not set; a stable release is not built without the release key."
              exit 1
            fi
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; the APK will be signed with the debug key (a different signature on every build)."
          fi

      - name: Read the version
        id: meta
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SOUNDMOD_VERBOSE: ${{ inputs.verbose_log }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK and show its signature
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "SoundMod-${VERSION}.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "SoundMod-${VERSION}.apk" | grep -i "SHA-256" || true

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: SoundMod-apk
          path: SoundMod-*.apk
          if-no-files-found: error
