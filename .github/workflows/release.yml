name: Release

# Runs manually only (Actions → Release → Run workflow). The version number is versionName in
# app/build.gradle.kts. It builds BOTH the release APK and the debug APK of the same version and attaches both to one
# GitHub release. The build fails if there is no release signing key.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Extra release notes (optional)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    with:
      require_signing: true
      build_debug: true
    secrets:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SoundTweaks-apk
          path: dist

      - name: Check for a release tag conflict
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v${VERSION} already exists. Bump versionName in app/build.gradle.kts."
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          ASSETS="**Assets:** \`SoundTweaks-${VERSION}.apk\` is the release build (use this one). \`SoundTweaks-${VERSION}-debug.apk\` is the debug build of the same version, with the verbose event log, for bug reports. Both are signed with the same key, so one can be installed over the other."
          gh release create "v${VERSION}" dist/SoundTweaks-*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Sound Tweaks ${VERSION}" --generate-notes --latest --notes "$ASSETS
          $NOTES"
