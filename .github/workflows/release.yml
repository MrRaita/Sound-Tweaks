name: Stable release

# Runs manually only (Actions → Stable release → Run workflow). The version number is
# versionName in app/build.gradle.kts; the build fails if there is no release key.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Extra release notes (optional)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    with:
      require_signing: true
    secrets:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SoundMod-apk
          path: dist

      - name: Check for a release tag conflict
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v${VERSION} already exists. Bump versionName in app/build.gradle.kts."
            exit 1
          fi

      - name: Create the stable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "v${VERSION}" dist/SoundMod-*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SoundMod ${VERSION}" --generate-notes --latest --notes "$NOTES"
