name: Kararlı sürüm

# Yalnızca elle çalıştırılır (Actions → Kararlı sürüm → Run workflow). Sürüm numarası
# app/build.gradle.kts içindeki versionName'dir; yayın anahtarı yoksa derleme başarısız olur.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Ek sürüm notu (isteğe bağlı)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    with:
      require_signing: true
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SoundMod-apk
          path: dist

      - name: Sürüm etiketi çakışmasını kontrol et
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v${VERSION} sürümü zaten var. app/build.gradle.kts içindeki versionName artırılmalı."
            exit 1
          fi

      - name: Kararlı sürüm oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SoundMod ${{ needs.build.outputs.version }}
          body: ${{ inputs.notes }}
          generate_release_notes: true
          prerelease: false
          make_latest: "true"
          files: dist/SoundMod-*.apk
