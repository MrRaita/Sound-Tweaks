name: Kararlı sürüm

# Yalnızca elle çalıştırılır (Actions → Kararlı sürüm → Run workflow). Sürüm numarası
# app/build.gradle.kts içindeki versionName'dir; yayın anahtarı yoksa derleme başarısız olur.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Ek sürüm notu (isteğe bağlı)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    with:
      require_signing: true
    secrets:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SoundMod-apk
          path: dist

      - name: Sürüm etiketi çakışmasını kontrol et
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v${VERSION} sürümü zaten var. app/build.gradle.kts içindeki versionName artırılmalı."
            exit 1
          fi

      - name: Kararlı sürüm oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "v${VERSION}" dist/SoundMod-*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SoundMod ${VERSION}" --generate-notes --latest --notes "$NOTES"
