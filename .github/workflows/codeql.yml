name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analiz (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - name: JDK kur
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle sürümünü oku
        if: matrix.language == 'java-kotlin'
        id: gv
        run: |
          V=$(sed -n 's#.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*#\1#p' gradle/wrapper/gradle-wrapper.properties | head -1)
          test -n "$V" || { echo "::error::gradle-wrapper.properties içinde Gradle sürümü bulunamadı"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Gradle kur
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: ${{ steps.gv.outputs.version }}

      - name: Gradle sarmalayıcıyı hazırla
        if: matrix.language == 'java-kotlin'
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "${{ steps.gv.outputs.version }}"
          fi
          chmod +x gradlew

      - name: CodeQL başlat
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Derle (CodeQL için)
        if: matrix.language == 'java-kotlin'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: CodeQL analizi
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
