name: Ön derleme

# Her push'ta otomatik çalışır; imzalı APK'yı artifact olarak yükler ve ön sürüm (pre-release) oluşturur.
on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: prebuild-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    with:
      verbose_log: true
    secrets: inherit

  publish:
    needs: build
    # Yalnızca varsayılan dala yapılan push'larda sürüm sayfasına konur; PR ve diğer dallar sadece artifact üretir.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SoundMod-apk
          path: dist

      - name: Ön sürüm oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: pre-${{ github.run_number }}
          TITLE: Ön sürüm ${{ needs.build.outputs.version }} (derleme ${{ github.run_number }})
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then SIG="yayın anahtarı"; else SIG="debug anahtarı (yayın anahtarı tanımlı değil)"; fi
          gh release create "$TAG" dist/SoundMod-*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TITLE" --prerelease \
            --notes "$(printf 'Otomatik ön derleme. Kararlı sürüm değildir.\nCommit: %s\nİmza: %s' "$GITHUB_SHA" "$SIG")"

      - name: Eski ön sürümleri temizle (son 10 kalsın)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("pre-")))] | .[10:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
