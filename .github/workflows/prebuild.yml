name: Pre-build

# Runs automatically on every push; uploads the signed APK as an artifact and creates a pre-release.
on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: prebuild-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    with:
      verbose_log: true
    # PR code must never see the release signing key: PR builds get empty secrets and are debug-signed
    secrets:
      SIGNING_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEYSTORE_BASE64 || '' }}
      SIGNING_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEYSTORE_PASSWORD || '' }}
      SIGNING_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEY_ALIAS || '' }}
      SIGNING_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEY_PASSWORD || '' }}

  publish:
    needs: build
    # Only pushes to the default branch are published as a release; PRs and other branches only produce an artifact.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SoundMod-apk
          path: dist

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: pre-${{ github.run_number }}
          TITLE: Pre-release ${{ needs.build.outputs.version }} (build ${{ github.run_number }})
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then SIG="release key"; else SIG="debug key (no release key is configured)"; fi
          gh release create "$TAG" dist/SoundMod-*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TITLE" --prerelease \
            --notes "$(printf 'Automatic pre-build. Not a stable release.\nCommit: %s\nSignature: %s' "$GITHUB_SHA" "$SIG")"

      - name: Clean up old pre-releases (keep the last 10)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("pre-")))] | .[10:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
