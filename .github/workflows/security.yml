name: Security and quality scan

# Free automated checks. Results appear in the Actions output, in job summaries and (for CodeQL) in GitHub's
# Security > Code scanning tab. CodeQL and dependency review are free for public repositories;
# a private repository needs GitHub Advanced Security, in which case these two jobs are skipped automatically.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: guvenlik-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Read the Gradle version
        id: gv
        run: |
          V=$(sed -n 's#.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*#\1#p' gradle/wrapper/gradle-wrapper.properties | head -1)
          test -n "$V" || { echo "::error::Could not find the Gradle version in gradle-wrapper.properties"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          S=$(sed -n 's/^distributionSha256Sum=//p' gradle/wrapper/gradle-wrapper.properties | head -1)
          echo "sha=$S" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: ${{ steps.gv.outputs.version }}

      - name: Run lint
        run: gradle --no-daemon lintDebug

      - name: Lint summary
        if: always()
        run: |
          f=app/build/reports/lint-results-debug.xml
          if [ -f "$f" ]; then
            python3 - "$f" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import collections, re, sys
          t = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          c = collections.Counter(re.findall(r'<issue\s[^>]*?severity="(\w+)"', t))
          print("### Android Lint summary\n")
          print("| Severity | Count |\n|---|---|")
          for k in ("Fatal", "Error", "Warning", "Informational"):
              print(f"| {k} | {c.get(k, 0)} |")
          PY
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-raporu
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  semgrep:
    name: Semgrep (rule-based security scan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Findings do not fail the job (informational); the job only turns red if the tool itself crashes.
      # Excluded: actions pinned by tag (the zizmor policy allows tags for GitHub's own actions) and
      # the launcher activity being exported (it is the app's only screen, so it must be).
      - name: Semgrep tara
        run: |
          pipx install semgrep
          semgrep scan \
            --config p/default --config p/kotlin --config p/secrets --config p/github-actions \
            --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag \
            --exclude-rule java.android.security.exported_activity.exported_activity \
            --metrics=off --sarif --output semgrep.sarif

      # Gate: only ERROR-severity findings fail the job (the report above stays informational)
      - name: Semgrep (fail on ERROR severity)
        run: |
          semgrep scan \
            --config p/default --config p/kotlin --config p/secrets --config p/github-actions \
            --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag \
            --exclude-rule java.android.security.exported_activity.exported_activity \
            --metrics=off --severity ERROR --error --quiet

      - name: Semgrep summary
        if: always()
        run: |
          if [ -f semgrep.sarif ]; then
            python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          d = json.load(open("semgrep.sarif"))
          res = [r for run in d.get("runs", []) for r in run.get("results", [])]
          print("### Semgrep summary\n")
          print(f"Total findings: **{len(res)}**\n")
          for r in res[:30]:
              loc = r["locations"][0]["physicalLocation"]
              print(f"- `{r['ruleId']}` — {loc['artifactLocation']['uri']}:{loc['region']['startLine']}")
          PY
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semgrep-raporu
          path: semgrep.sarif
          if-no-files-found: ignore

  codeql:
    name: CodeQL (${{ matrix.language }})
    # Does not work in a private repository without GitHub Advanced Security; skipped so it does not fail every time.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: JDK kur
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Read the Gradle version
        if: matrix.language == 'java-kotlin'
        id: gv
        run: |
          V=$(sed -n 's#.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*#\1#p' gradle/wrapper/gradle-wrapper.properties | head -1)
          test -n "$V" || { echo "::error::Could not find the Gradle version in gradle-wrapper.properties"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          S=$(sed -n 's/^distributionSha256Sum=//p' gradle/wrapper/gradle-wrapper.properties | head -1)
          echo "sha=$S" >> "$GITHUB_OUTPUT"

      - name: Gradle kur
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: ${{ steps.gv.outputs.version }}

      - name: Prepare the Gradle wrapper
        if: matrix.language == 'java-kotlin'
        env:
          GV: ${{ steps.gv.outputs.version }}
          GSHA: ${{ steps.gv.outputs.sha }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            # Verify the distribution against the checksum pinned in gradle-wrapper.properties
            if [ -n "$GSHA" ]; then
              gradle wrapper --gradle-version "$GV" --gradle-distribution-sha256-sum "$GSHA"
            else
              gradle wrapper --gradle-version "$GV"
            fi
          fi
          chmod +x gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Build (for CodeQL)
        if: matrix.language == 'java-kotlin'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: CodeQL analizi
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  gizli-anahtar:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The signing key must live only in GitHub Secrets; it must never enter the repository.
      - name: Is a signing key file in the repository?
        run: |
          found=$(git log --all --name-only --pretty=format: | grep -i -E '\.(jks|keystore|p12|pfx)$' | sort -u || true)
          if [ -n "$found" ]; then
            echo "::error::A key file was found in the repository history:"
            echo "$found"
            exit 1
          fi

      # Findings fail the job: a leaked secret must be revoked.
      - name: Gitleaks (entire git history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --report-format sarif --report-path /repo/gitleaks.sarif --verbose

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitleaks-raporu
          path: gitleaks.sarif
          if-no-files-found: ignore

  workflow-guvenligi:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Findings do not fail the job (informational); the job only turns red if the tool itself crashes.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx install zizmor
          set +e
          zizmor --format sarif . > zizmor.sarif
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -lt 10 ]; then
            echo "::error::zizmor failed to run (exit code $rc)"
            exit "$rc"
          fi
          # Exit codes: 10 informational, 11 low, 12 medium, 13 high, 14 critical. High and critical fail the job.
          echo "zizmor_rc=$rc" >> "$GITHUB_ENV"

      - name: zizmor summary
        if: always()
        run: |
          if [ -s zizmor.sarif ]; then
            python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          d = json.load(open("zizmor.sarif"))
          res = [r for run in d.get("runs", []) for r in run.get("results", [])]
          print("### zizmor summary\n")
          print(f"Total findings: **{len(res)}**\n")
          for r in res[:30]:
              loc = r["locations"][0]["physicalLocation"]
              print(f"- `{r['ruleId']}` — {loc['artifactLocation']['uri']}:{loc['region']['startLine']}")
          PY
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zizmor-raporu
          path: zizmor.sarif
          if-no-files-found: ignore

      - name: Fail on high/critical findings
        if: always()
        run: |
          if [ "${zizmor_rc:-0}" -ge 13 ]; then
            echo "::error::zizmor reported high or critical findings"
            exit 1
          fi

  bagimlilik-incelemesi:
    name: Dependency review
    # PRs in public repositories only: looks for known vulnerabilities in the dependencies a PR adds or updates.
    if: ${{ github.event_name == 'pull_request' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
