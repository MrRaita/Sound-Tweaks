version: 2
updates:
  # Gradle bağımlılıkları (app/build.gradle.kts ve eklenti sürümleri)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
    ignore:
      # Modül API 101'de kalır (daha eski Vector/LSPosed sürümleriyle uyumlu); 102 gerekirse elle opsiyonel eklenir
      - dependency-name: "io.github.libxposed:api"
        update-types: ["version-update:semver-major"]

  # GitHub Actions sürümleri
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
