version: 2
updates:
  # Gradle dependencies (app/build.gradle.kts and plugin versions)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Newly published versions are not picked up immediately (malicious/unstable release risk); security updates are not affected
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
    ignore:
      # The module API stays at 101 (compatible with older Vector/LSPosed versions); 102 can be added by hand as an option if needed
      - dependency-name: "io.github.libxposed:api"
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
